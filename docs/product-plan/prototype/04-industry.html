<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投研助手 · 行业</title>
<link rel="stylesheet" href="shared.css?v=13">
<link rel="stylesheet" href="industry/industry.css?v=6">
<script src="theme.js?v=3"></script>
</head>
<body>
<div class="shell ind-shell" id="shell">
  <div class="topbar">
    <span class="topbar-brand">投研助手</span>
    <div class="topbar-right">
      <button type="button" class="market-realtime" id="industry-realtime" aria-pressed="true">
        <i aria-hidden="true"></i><span>实时行情</span>
      </button>
      <button type="button" class="topbar-agent" id="btn-agent">助手</button>
    </div>
  </div>

  <nav class="rail">
    <a class="rail-btn active" href="01-market.html">
      <svg class="rail-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18"/><path d="M5 14l4-5 3.5 3L17 6"/><path d="M14 6h3v3"/></svg>
      <span>行情</span>
    </a>
    <a class="rail-btn" href="02-research.html">
      <svg class="rail-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h8l4 4v12H7V4z"/><path d="M15 4v4h4M9 12h6M9 16h4"/></svg>
      <span>研究</span>
    </a>
    <a class="rail-btn" href="03-data.html">
      <svg class="rail-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v14H5z"/><path d="M5 9h14M5 13h14M5 17h14M10 5v14M15 5v14"/></svg>
      <span>数据</span>
    </a>
    <div class="rail-spacer"></div>
    <div class="rail-avatar">陈</div>
  </nav>

  <main class="main-area">
    <div class="content-with-agent">
      <div class="page-body">
        <div class="industry-page">
          <div class="industry-crumb">
            <a href="01-market.html">行情</a>
            <span>/</span>
            <span>行业</span>
            <span>/</span>
            <span class="here" id="crumb-name">半导体</span>
            <a class="join" href="02-research.html" id="industry-research">加入研究</a>
          </div>

          <div id="industry-overview"></div>
          <div id="industry-chain-slot"></div>
          <div id="industry-signals-slot"></div>
          <div id="industry-companies-slot"></div>
        </div>
      </div>

      <aside class="agent-drawer" id="agent" aria-hidden="true">
        <div class="agent-hd">
          <div class="info">
            <div class="t" id="agent-obj">半导体</div>
            <div class="s" id="agent-ctx">行业数据 · 产业链 / 景气度 / 重点公司</div>
          </div>
          <button type="button" class="x" id="agent-close" aria-label="关闭">×</button>
        </div>
        <div class="agent-body" id="agent-body">
          <div class="msg" id="agent-greeting">
            <div class="who">助手</div>
            当前在看 <strong id="agent-greet-name">半导体</strong>。可以问产业链位置、景气变化或重点公司的经营差异。
          </div>
          <div class="suggest" id="agent-suggest">
            <button type="button" data-q="当前景气度由哪些数据支撑？">当前景气度由哪些数据支撑？</button>
            <button type="button" data-q="产业链各环节有哪些重点公司？">产业链各环节有哪些重点公司？</button>
            <button type="button" data-q="重点公司的表现分化在哪里？">重点公司的表现分化在哪里？</button>
          </div>
        </div>
        <div class="agent-ft">
          <input type="text" id="agent-input" placeholder="继续分析…">
          <button type="button" id="agent-send">发送</button>
        </div>
      </aside>
    </div>
  </main>
</div>

<script src="industry/data.js?v=2"></script>
<script src="industry/components.js?v=5"></script>
<script src="industry/page.js?v=3"></script>
<script src="nav-collapse.js?v=10"></script>
</body>
</html>
